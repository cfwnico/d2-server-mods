[Settings]
; 是否启用该插件 (1=启用, 0=关闭)
Enable=1

; 是否处于测试阶段 (1=测试模式，所有装备均可触发; 0=正式模式，仅精英暗金武器/防具及暗金戒指/护身符)
TestMode=1

; 是否仅限阿卡拉 (1=仅第一幕阿卡拉触发; 0=所有可交易NPC触发)
OnlyAkara=1

; 符文随机范围的下限与上限 (支持 1 到 33 之间任意区间)
; 例如改为 22 到 30，只需设置:
; MinRune=22
; MaxRune=30
MinRune=18
MaxRune=33

[RuneWeights]
; 符文生成相对权重（数值越大，生成概率越高）
; 实际生成概率 = 该符文权重 / [MinRune 到 MaxRune 区间内的所有权重总和]

